# Какого хера home-manager конвертирует
# nix конфиг в луа.
# и почему не работает decorations, animatiaonsn, ... в луа конфиге.

#---Variables---#
$mod = SUPER
$term = kitty
$file = dolphin
$menu = wofi --show drun
$picker = hyprpicker -an
$nc = swaync-client -t && swaync-client --open-panel

exec-once = waybar
exec-once = swaybg -i ~/walls/nix-wall-3.png -m fill
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP

env = XCURSOR_SIZE, 24
env = HYPRCURSOR_SIZE, 24

monitor = ,preferred,auto,auto

general {
    gaps_in = 7.4
    gaps_out = 7.4
    border_size = 2
    col.active_border = rgb(b4befe) 45deg
    col.inactive_border = rgba(595959aa)
    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 5
    rounding_power = 5.5
    active_opacity = 0.989
    inactive_opacity = 0.98

    shadow {
        enabled = true
        range = 4
        render_power = 4
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        size = 5
        passes = 1
        vibrancy = 0.1707
    }
}

animations {
    enabled = true
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
}

input {
    kb_layout = us, ru
    kb_options = grp:caps_toggle
    follow_mouse = 1
    touchpad {
        natural_scroll = false
    }
}

gestures {
    workspace_swipe_invert = false
    workspace_swipe_forever	= true
}

gesture = 3, horizontal, workspace

device {
    name = epic-mouse-v1
    sensitivity = -0.3
}

misc {
    force_default_wallpaper = -1
    disable_hyprland_logo = true
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
    new_on_top = true
    mfact = 0.5
}

#---Basics-binds---#
bind = $mod, Q, exec, $term
bind = $mod, C, killactive,
bind = $mod, M, exec, pkill start-hyprland,
bind = $mod, E, exec, $file
bind = $mod, R, exec, $menu
bind = $mod, F, togglefloating,
bind = $mod, L, exec, hyprlock
bind = $mod, P, exec, $picker
bind = $mod, N, exec, $nc
bind = $mod SHIFT, Print, exec, grim -g "$(slurp)" ~/Pictures/screenshot-"$(date +%d-%H-%M-%S)".png
bind = $mod SHIFT, R, exec, hyprctl reload

#---Windows-binds---#
bind = $mod, left,  movefocus, l,
bind = $mod, right, movefocus, r,
bind = $mod, up,    movefocus, u,
bind = $mod, down,  movefocus, d,

bind = $mod SHIFT, left,   swapwindow, l,
bind = $mod SHIFT, right,  swapwindow, r,
bind = $mod SHIFT, up,     swapwindow, u,
bind = $mod SHIFT, down,   swapwindow, d,

bind = $mod CTRL, left,  resizeactive, -60 0
bind = $mod CTRL, right, resizeactive,  60 0
bind = $mod CTRL, up,    resizeactive,  0 -60
bind = $mod CTRL, down,  resizeactive,  0 60

#---Workspaces-binds---#
bind = $mod, 1,  workspace, 1
bind = $mod, 2,  workspace, 2
bind = $mod, 3,  workspace, 3
bind = $mod, 4,  workspace, 4
bind = $mod, 5,  workspace, 5
bind = $mod, 6,  workspace, 6
bind = $mod, 7,  workspace, 7
bind = $mod, 8,  workspace, 8
bind = $mod, 9,  workspace, 9

bind = $mod SHIFT, 1,  movetoworkspacesilent, 1
bind = $mod SHIFT, 2,  movetoworkspacesilent, 2
bind = $mod SHIFT, 3,  movetoworkspacesilent, 3
bind = $mod SHIFT, 4,  movetoworkspacesilent, 4
bind = $mod SHIFT, 5,  movetoworkspacesilent, 5
bind = $mod SHIFT, 6,  movetoworkspacesilent, 6
bind = $mod SHIFT, 7,  movetoworkspacesilent, 7
bind = $mod SHIFT, 8,  movetoworkspacesilent, 8
bind = $mod SHIFT, 9,  movetoworkspacesilent, 9
bind = $mod SHIFT, 10, movetoworkspacesilent, 10

#---Moving/Resizing-windows---#
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bindel = ,XF86AudioRaiseVolume,  exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume,  exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute,         exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute,      exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = $mod, bracketright, exec, brightnessctl s 10%+
bindel = $mod, bracketleft,  exec, brightnessctl s 10%-
